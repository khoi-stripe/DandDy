<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .edge { fill: none; stroke: #4ade80; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .face { fill: #0a0a0a; }
    @media (prefers-color-scheme: light) {
      .edge { stroke: #16a34a; }
      .face { fill: #f0fdf4; }
    }
  </style>
  <!-- Icosahedron (d20) projected view -->
  <polygon class="face" points="16,2 28,10 28,22 16,30 4,22 4,10"/>
  <polygon class="edge" points="16,2 28,10 28,22 16,30 4,22 4,10"/>
  <!-- Inner structure -->
  <line class="edge" x1="16" y1="2" x2="16" y2="30"/>
  <line class="edge" x1="4" y1="10" x2="28" y2="22"/>
  <line class="edge" x1="28" y1="10" x2="4" y2="22"/>
  <!-- Cross vertices -->
  <line class="edge" x1="16" y1="2" x2="4" y2="22"/>
  <line class="edge" x1="16" y1="2" x2="28" y2="22"/>
  <line class="edge" x1="16" y1="30" x2="4" y2="10"/>
  <line class="edge" x1="16" y1="30" x2="28" y2="10"/>
</svg>

