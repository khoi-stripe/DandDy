<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Order Debug Tool</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        h1 {
            color: #0ff;
        }
        h2 {
            color: #ff0;
            margin-top: 30px;
        }
        .character {
            background: #2a2a2a;
            border: 1px solid #0f0;
            padding: 10px;
            margin: 10px 0;
        }
        .character-name {
            font-weight: 500;
            color: #0ff;
            font-size: 1.2em;
        }
        .timestamp {
            color: #f0f;
        }
        .id {
            color: #888;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: monospace;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0ff;
        }
        .warning {
            color: #f00;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>📊 Sort Order Debug Tool</h1>
    
    <button onclick="refreshData()">🔄 Refresh Data</button>
    
    <h2>Characters (Current Order)</h2>
    <div id="charactersOutput"></div>
    
    <h2>Characters (Sorted by Date Modified Logic)</h2>
    <div id="sortedOutput"></div>

    <script>
        function refreshData() {
            // Resolve storage keys using shared DanddyStorage when available
            const storageKey =
                (window.DanddyStorage && window.DanddyStorage.STORAGE_KEY) ||
                'dnd_characters';

            // Get characters via shared storage helper when available so this
            // stays in sync with any custom CHARACTER_STORAGE_KEY config.
            const characters =
                (window.DanddyStorage && typeof window.DanddyStorage.readAll === 'function')
                    ? window.DanddyStorage.readAll()
                    : (function (key) {
                          const raw = localStorage.getItem(key);
                          return raw ? JSON.parse(raw) : [];
                      })(storageKey);
            
            // Display characters
            let charactersHtml = '';
            characters.forEach((char, index) => {
                const effectiveTime =
                    char.updatedAt ||
                    char.createdAt ||
                    (char.metadata && (char.metadata.exportDate || char.metadata.exportedAt)) ||
                    '0';
                charactersHtml += `
                    <div class="character">
                        <div class="character-name">${index + 1}. ${char.name}</div>
                        <div class="id">ID: ${char.id}</div>
                        <div class="timestamp">createdAt: ${char.createdAt || '<span class="warning">MISSING</span>'}</div>
                        <div class="timestamp">updatedAt: ${char.updatedAt || '<span class="warning">MISSING</span>'}</div>
                        <div class="timestamp"><strong>Effective Sort Time: ${effectiveTime}</strong></div>
                    </div>
                `;
            });
            document.getElementById('charactersOutput').innerHTML = charactersHtml;
            
            // Sort and display
            const sorted = [...characters].sort((a, b) => {
                const aMeta =
                    (a.metadata && (a.metadata.exportDate || a.metadata.exportedAt)) ||
                    null;
                const bMeta =
                    (b.metadata && (b.metadata.exportDate || b.metadata.exportedAt)) ||
                    null;
                const aTime = new Date(a.updatedAt || a.createdAt || aMeta || 0).getTime();
                const bTime = new Date(b.updatedAt || b.createdAt || bMeta || 0).getTime();
                if (aTime === bTime) {
                    return (a.name || '').localeCompare(b.name || '');
                }
                return bTime - aTime; // newest first
            });
            
            let sortedHtml = '';
            sorted.forEach((char, index) => {
                const effectiveTime =
                    char.updatedAt ||
                    char.createdAt ||
                    (char.metadata && (char.metadata.exportDate || char.metadata.exportedAt)) ||
                    '0';
                const timeMs = new Date(effectiveTime).getTime();
                sortedHtml += `
                    <div class="character">
                        <div class="character-name">${index + 1}. ${char.name}</div>
                        <div class="id">ID: ${char.id}</div>
                        <div class="timestamp"><strong>Sort Time: ${effectiveTime}</strong> (${timeMs})</div>
                    </div>
                `;
            });
            document.getElementById('sortedOutput').innerHTML = sortedHtml;
        }

        // Auto-load on page load
        refreshData();
    </script>
</body>
</html>
