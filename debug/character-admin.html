<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Admin - DandDy</title>
  <link rel="stylesheet" href="../terminal-theme.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: var(--terminal-bg);
      color: var(--terminal-fg);
      font-family: var(--font-mono);
      padding: 20px;
      min-height: 100vh;
      margin: 0;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--terminal-border);
    }

    h1 {
      color: var(--sheet-accent);
      margin: 0;
      font-size: 1.4rem;
    }

    .subtitle {
      color: var(--terminal-dim);
      font-size: 12px;
      margin-top: 4px;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--terminal-border);
      color: var(--terminal-fg);
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--terminal-fg);
      color: var(--terminal-bg);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-danger {
      border-color: #ff4444;
      color: #ff4444;
    }

    .btn-danger:hover:not(:disabled) {
      background: #ff4444;
      color: #000;
    }

    .selection-info {
      color: var(--terminal-dim);
      font-size: 12px;
    }

    .selection-info strong {
      color: var(--sheet-accent);
    }

    /* Search */
    .search-box {
      background: var(--terminal-bg);
      border: 1px solid var(--terminal-border);
      color: var(--terminal-fg);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      width: 250px;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--sheet-accent);
    }

    .search-box::placeholder {
      color: var(--terminal-dim);
    }

    /* Table */
    .table-container {
      border: 1px solid var(--terminal-border);
      overflow: auto;
      max-height: calc(100vh - 200px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--terminal-border);
    }

    th {
      background: rgba(0, 0, 0, 0.3);
      color: var(--sheet-accent);
      font-weight: normal;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover {
      background: rgba(38, 189, 192, 0.05);
    }

    tr.selected {
      background: rgba(0, 255, 0, 0.1);
    }

    /* Checkbox */
    .checkbox-cell {
      width: 40px;
      text-align: center;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--sheet-accent);
    }

    /* Status */
    .status {
      padding: 16px;
      text-align: center;
      color: var(--terminal-dim);
    }

    .status.error {
      color: #ff4444;
    }

    .loading {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Character details */
    .char-name {
      color: var(--terminal-fg);
      font-weight: bold;
    }

    .char-meta {
      color: var(--terminal-dim);
      font-size: 11px;
    }

    .char-id {
      color: var(--terminal-dim);
      font-size: 10px;
      font-family: monospace;
    }

    /* Auth section */
    .auth-section {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--terminal-border);
      padding: 16px;
      margin-bottom: 20px;
    }

    .auth-section h3 {
      color: var(--sheet-accent);
      margin: 0 0 12px 0;
      font-size: 12px;
      text-transform: uppercase;
    }

    .auth-form {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      color: var(--terminal-dim);
      font-size: 10px;
      text-transform: uppercase;
    }

    .form-group input {
      background: var(--terminal-bg);
      border: 1px solid var(--terminal-border);
      color: var(--terminal-fg);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      width: 200px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--sheet-accent);
    }

    .auth-status {
      color: var(--terminal-dim);
      font-size: 11px;
      margin-top: 8px;
    }

    .auth-status.success {
      color: var(--terminal-fg);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--terminal-bg);
      border: 2px solid #ff4444;
      padding: 24px;
      max-width: 400px;
    }

    .modal h3 {
      color: #ff4444;
      margin: 0 0 16px 0;
    }

    .modal p {
      color: var(--terminal-dim);
      margin: 0 0 20px 0;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <div>
      <h1>🔧 Character Admin</h1>
      <div class="subtitle">Manage all characters in the database</div>
    </div>
    <div>
      <span id="totalCount" class="selection-info"></span>
    </div>
  </div>

  <!-- Auth Section -->
  <div class="auth-section">
    <h3>Authentication</h3>
    <div class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••">
      </div>
      <button class="btn" onclick="login()">Login</button>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
    <div id="authStatus" class="auth-status">Not logged in</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <input type="text" class="search-box" id="searchBox" placeholder="Search characters..." oninput="filterCharacters()">
    <button class="btn" onclick="selectAll()">Select All</button>
    <button class="btn" onclick="selectNone()">Select None</button>
    <button class="btn btn-danger" id="deleteBtn" onclick="confirmDelete()" disabled>Delete Selected (0)</button>
    <button class="btn" onclick="loadCharacters()">↻ Refresh</button>
    <span class="selection-info" id="selectionInfo"></span>
  </div>

  <!-- Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="checkbox-cell">
            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
          </th>
          <th>Name</th>
          <th>Race / Class</th>
          <th>Level</th>
          <th>Owner</th>
          <th>Created</th>
          <th>ID</th>
        </tr>
      </thead>
      <tbody id="characterTable">
        <tr>
          <td colspan="7" class="status">Login to view characters</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>⚠️ Confirm Delete</h3>
      <p id="deleteMessage">Are you sure you want to delete these characters? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" onclick="executeDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // Config
    const API_BASE = 'https://danddy-backend.onrender.com';

    // State
    let token = localStorage.getItem('admin_token') || null;
    let characters = [];
    let filteredCharacters = [];
    let selectedIds = new Set();

    // Auth
    async function login() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        showAuthStatus('Please enter email and password', false);
        return;
      }

      try {
        const formData = new URLSearchParams();
        formData.append('username', email);
        formData.append('password', password);

        console.log('Attempting login to:', API_BASE);
        
        const response = await fetch(`${API_BASE}/auth/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error('Login error response:', errorText);
          throw new Error(`Invalid credentials (${response.status})`);
        }

        const data = await response.json();
        token = data.access_token;
        localStorage.setItem('admin_token', token);
        showAuthStatus(`Logged in as ${email}`, true);
        loadCharacters();
      } catch (err) {
        console.error('Login error:', err);
        if (err.message.includes('Failed to fetch')) {
          showAuthStatus(`Cannot reach backend at ${API_BASE}. Is it running?`, false);
        } else {
          showAuthStatus(`Login failed: ${err.message}`, false);
        }
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('admin_token');
      characters = [];
      filteredCharacters = [];
      selectedIds.clear();
      showAuthStatus('Not logged in', false);
      renderTable();
      updateControls();
    }

    function showAuthStatus(message, success) {
      const el = document.getElementById('authStatus');
      el.textContent = message;
      el.className = 'auth-status' + (success ? ' success' : '');
    }

    // Load Characters
    async function loadCharacters() {
      if (!token) {
        showTableStatus('Login to view characters');
        return;
      }

      showTableStatus('Loading...', true);

      try {
        const response = await fetch(`${API_BASE}/characters/`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.status === 401) {
          logout();
          throw new Error('Session expired');
        }

        if (!response.ok) {
          throw new Error('Failed to load characters');
        }

        characters = await response.json();
        filteredCharacters = [...characters];
        selectedIds.clear();
        document.getElementById('totalCount').textContent = `${characters.length} total characters`;
        renderTable();
        updateControls();
      } catch (err) {
        showTableStatus(`Error: ${err.message}`, false, true);
      }
    }

    // Render
    function renderTable() {
      const tbody = document.getElementById('characterTable');
      
      if (filteredCharacters.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="status">No characters found</td></tr>';
        return;
      }

      tbody.innerHTML = filteredCharacters.map(char => `
        <tr class="${selectedIds.has(char.id) ? 'selected' : ''}" onclick="toggleSelect(${char.id}, event)">
          <td class="checkbox-cell">
            <input type="checkbox" ${selectedIds.has(char.id) ? 'checked' : ''} onchange="toggleSelect(${char.id}, event)">
          </td>
          <td>
            <div class="char-name">${escapeHtml(char.name || 'Unnamed')}</div>
          </td>
          <td>
            <div class="char-meta">${escapeHtml(char.race || '?')} ${escapeHtml(char.character_class || '?')}</div>
          </td>
          <td>${char.level || 1}</td>
          <td class="char-meta">${char.user_id || 'N/A'}</td>
          <td class="char-meta">${formatDate(char.created_at)}</td>
          <td class="char-id">${char.id}</td>
        </tr>
      `).join('');
    }

    function showTableStatus(message, loading = false, error = false) {
      const tbody = document.getElementById('characterTable');
      tbody.innerHTML = `<tr><td colspan="7" class="status ${loading ? 'loading' : ''} ${error ? 'error' : ''}">${message}</td></tr>`;
    }

    // Selection
    function toggleSelect(id, event) {
      if (event) event.stopPropagation();
      
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      
      renderTable();
      updateControls();
    }

    function selectAll() {
      filteredCharacters.forEach(c => selectedIds.add(c.id));
      renderTable();
      updateControls();
    }

    function selectNone() {
      selectedIds.clear();
      renderTable();
      updateControls();
    }

    function toggleSelectAll() {
      const checkbox = document.getElementById('selectAllCheckbox');
      if (checkbox.checked) {
        selectAll();
      } else {
        selectNone();
      }
    }

    function updateControls() {
      const count = selectedIds.size;
      const deleteBtn = document.getElementById('deleteBtn');
      deleteBtn.disabled = count === 0;
      deleteBtn.textContent = `Delete Selected (${count})`;
      
      document.getElementById('selectionInfo').textContent = 
        count > 0 ? `${count} selected` : '';
      
      document.getElementById('selectAllCheckbox').checked = 
        filteredCharacters.length > 0 && selectedIds.size === filteredCharacters.length;
    }

    // Search
    function filterCharacters() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      
      if (!query) {
        filteredCharacters = [...characters];
      } else {
        filteredCharacters = characters.filter(c => 
          (c.name || '').toLowerCase().includes(query) ||
          (c.race || '').toLowerCase().includes(query) ||
          (c.character_class || '').toLowerCase().includes(query) ||
          String(c.id).includes(query)
        );
      }
      
      renderTable();
      updateControls();
    }

    // Delete
    function confirmDelete() {
      if (selectedIds.size === 0) return;
      
      document.getElementById('deleteMessage').textContent = 
        `Are you sure you want to delete ${selectedIds.size} character(s)? This action cannot be undone.`;
      document.getElementById('deleteModal').classList.add('show');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('show');
    }

    async function executeDelete() {
      closeDeleteModal();
      
      const idsToDelete = [...selectedIds];
      let deleted = 0;
      let failed = 0;

      for (const id of idsToDelete) {
        try {
          const response = await fetch(`${API_BASE}/characters/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });

          if (response.ok) {
            deleted++;
          } else {
            failed++;
          }
        } catch (err) {
          failed++;
        }
      }

      alert(`Deleted: ${deleted}, Failed: ${failed}`);
      loadCharacters();
    }

    // Helpers
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString();
      } catch {
        return dateStr;
      }
    }

    // Init
    if (token) {
      showAuthStatus('Logged in (token from storage)', true);
      loadCharacters();
    }
  </script>
</body>
</html>
