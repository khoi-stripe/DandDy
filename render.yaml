services:
  - type: web
    name: danddy-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (Supabase connection string)
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: PRODUCTION
        value: true
      - key: ALLOWED_ORIGINS
        value: https://danddy.app,https://khoi-stripe.github.io
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard (keep it secret!)
      - key: POSTMARK_SERVER_TOKEN
        sync: false  # Set manually in Render dashboard (keep it secret!)
      - key: EMAIL_FROM
        value: no-reply@danddy.app
      - key: FRONTEND_RESET_BASE
        value: https://danddy.app/index.html

